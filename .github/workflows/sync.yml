name: Sync Itch.io & YouTube Data

on:
  schedule:
    # Se ejecuta 2 veces al dia: a la 1:00 de la tarde (13:00) y a la 1:00 de la madrugada (01:00) hora peninsular (UTC 11:00 y 23:00)
    - cron: '0 11,23 * * *'
  # Permite ejecutarlo manualmente desde la pestania Actions de GitHub con un solo clic
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar Script de Sincronizacion
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync_data.js

      - name: Guardar cambios si hay actualizaciones
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json videos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync Itch.io games and YouTube videos [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No hay cambios nuevos para sincronizar."
          fi
